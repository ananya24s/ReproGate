server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable and safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The client is a single-page application: unknown paths are routes, not
    # missing files, so they resolve to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
